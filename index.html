<!DOCTYPE html>
<html lang="es">
  <head>
    <meta charset="UTF-8">
    <title>Rastreador de IP</title>
    <style>
      body {
        background-color: #1A1717;
        color: #267800;
      }
      .caja {
        background-color: #121010;
        border: 2px solid #267800;
        border-radius: 10px;
        padding: 25px; 
        max-width: 450px; 
        margin: 80px auto;
      }
      input {
        background-color: #1A1717;
  color: #4ade80;
  border: 1px solid #267800;
  border-radius: 6px;
  padding: 10px;
  width: 65%;
  outline: none;
}
      button {
  background-color: #267800;
  color: #1A1717;
  border: none;
  border-radius: 6px;
  padding: 10px 15px;
  font-weight: bold;
  cursor: pointer;
}

button:hover {
  background-color: #267800;
  color: #1A1717;
  border: none;
  border-radius: 6px;
  padding: 10px 15px;
  font-weight: bold;
  cursor: pointer;
}

button:hover {
  background-color: #4ade80;
}
    </style>
  </head>
  <body>

    <div class="caja">
      <h1>Rastreador de IP</h1>
      <input type="text" id="input-ip" placeholder="Ej: 8.8.8.8">
      <button id="btn-buscar">Buscar IP</button>
      <div id="resultado"></div>
      <script>
      // 1. Conectamos los elementos HTML con JavaScript
      const inputIp = document.getElementById("input-ip");
      const btnBuscar = document.getElementById("btn-buscar");
      const cajaResultado = document.getElementById("resultado");

      // 2. Le decimos al botón que ejecute rastrearIP al hacer clic
      btnBuscar.addEventListener("click", rastrearIP);

      // 3. Función principal
      async function rastrearIP() {
        const ip = inputIp.value.trim();

        if (ip === "") {
          cajaResultado.innerHTML = "<p>Por favor, ingresa una IP válida.</p>";
          return;
        }

        cajaResultado.innerHTML = "<p>Rastreando IP...</p>";

        try {
          const respuesta = await fetch(`https://ipapi.co/${ip}/json/`);
          const datos = await respuesta.json();

          if (datos.error) {
            cajaResultado.innerHTML = `<p>Error: ${datos.reason}</p>`;
            return;
          }

          cajaResultado.innerHTML = `
            <p><strong>IP:</strong> ${datos.ip}</p>
            <p><strong>País:</strong> ${datos.country_name}</p>
            <p><strong>Ciudad:</strong> ${datos.city}</p>
            <p><strong>Proveedor (ISP):</strong> ${datos.org}</p>
            <p><strong>Coordenadas:</strong> ${datos.latitude}, ${datos.longitude}</p>
          `;
        } catch (error) {
          cajaResultado.innerHTML = "<p>Error de conexión al consultar la API.</p>";
        }
      }
    </script>

    </div>
  </body>
</html>
