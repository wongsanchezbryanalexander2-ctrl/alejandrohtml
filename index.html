<!DOCTYPE html>
<html lang="es">
  <head>
    <meta charset="UTF-8">
    <title>Rastreador IP y Teléfono</title>
    <style>
      body {
        background-color: #1A1717;
        color: #A10A0E;
        font-family: sans-serif;
      }

      .caja {
        background-color: #121010;
        border: 2px solid #A10A0E;
        border-radius: 10px;
        padding: 25px;
        max-width: 450px;
        margin: 80px auto;
      }
      
      .pestanas {
        display: flex;
        gap: 10px;
        margin-bottom: 20px;
        border-bottom: 1px solid #A10A0E;
        padding-bottom: 12px;
      }

      .btn-tab {
        flex: 1;
        background-color: #1A1717;
        color: #A10A0E;
        border: 1px solid #A10A0E;
        border-radius: 6px;
        padding: 8px;
        font-weight: bold;
        cursor: pointer;
      }

      .btn-tab.activa {
        background-color: #A10A0E;
        color: #1A1717;
      }

      input {
        background-color: #1A1717;
        color: #4ade80;
        border: 1px solid #A10A0E;
        border-radius: 6px;
        padding: 10px;
        width: 65%;
        outline: none;
      }

      .btn-accion {
        background-color: #A10A0E;
        color: #1A1717;
        border: none;
        border-radius: 6px;
        padding: 10px 15px;
        font-weight: bold;
        cursor: pointer;
      }

      .btn-accion:hover {
        background-color: #4ade80;
      }

      .resultado {
        margin-top: 20px;
        color: #4ade80;
        line-height: 1.6;
      }
    </style>
  </head>
  <body>

    <div class="caja">--

      <div class="pestanas">
        <button id="tab-ip" class="btn-tab activa">Rastrear IP</button>
        <button id="tab-tel" class="btn-tab">Rastrear Teléfono</button>
      </div>
      
      <div id="seccion-ip">
        <h1>Rastreador de IP</h1>
        <input type="text" id="input-ip" placeholder="Ej: 8.8.8.8">
        <button id="btn-buscar-ip" class="btn-accion">Buscar IP</button>
        <div id="resultado-ip" class="resultado"></div>
      </div>

      <div id="seccion-tel" style="display: none;">
        <h1>Rastreador Telefónico</h1>
        <input type="text" id="input-tel" placeholder="Ej: +51987654321">
        <button id="btn-buscar-tel" class="btn-accion">Buscar Tel</button>
        <div id="resultado-tel" class="resultado"></div>
      </div>
    </div>

    <script>
      const tabIp = document.getElementById("tab-ip");
      const tabTel = document.getElementById("tab-tel");
      const seccionIp = document.getElementById("seccion-ip");
      const seccionTel = document.getElementById("seccion-tel");

      tabIp.addEventListener("click", () => {
        seccionIp.style.display = "block";
        seccionTel.style.display = "none";
        tabIp.classList.add("activa");
        tabTel.classList.remove("activa");
      });

      tabTel.addEventListener("click", () => {
        seccionIp.style.display = "none";
        seccionTel.style.display = "block";
        tabTel.classList.add("activa");
        tabIp.classList.remove("activa");
      });

      const inputIp = document.getElementById("input-ip");
      const btnBuscarIp = document.getElementById("btn-buscar-ip");
      const resIp = document.getElementById("resultado-ip");

      btnBuscarIp.addEventListener("click", async () => {
        const ip = inputIp.value.trim();
        if (ip === "") {
          resIp.innerHTML = "<p>Por favor, ingresa una IP válida.</p>";
          return;
        }
        resIp.innerHTML = "<p>Rastreando IP...</p>";

        try {
          const respuesta = await fetch(`https://ipapi.co/${ip}/json/`);
          const datos = await respuesta.json();

          if (datos.error) {
            resIp.innerHTML = `<p>Error: ${datos.reason}</p>`;
            return;
          }

          resIp.innerHTML = `
            <p><strong>IP:</strong> ${datos.ip}</p>
            <p><strong>País:</strong> ${datos.country_name}</p>
            <p><strong>Ciudad:</strong> ${datos.city}</p>
            <p><strong>Proveedor (ISP):</strong> ${datos.org}</p>
            <p><strong>Coordenadas:</strong> ${datos.latitude}, ${datos.longitude}</p>
          `;
        } catch (error) {
          resIp.innerHTML = "<p>Error de conexión al consultar la API.</p>";
        }
      });

      const inputTel = document.getElementById("input-tel");
      const btnBuscarTel = document.getElementById("btn-buscar-tel");
      const resTel = document.getElementById("resultado-tel");

      btnBuscarTel.addEventListener("click", async () => {
        const numero = inputTel.value.trim();
        const apiKey = "pegar api key";

        if (numero === "") {
          resTel.innerHTML = "<p>Por favor, ingresa un número con código de país (ej: +51...).</p>";
          return;
        }

        if (apiKey === "PEGA_TU_API_KEY_AQUI") {
          resTel.innerHTML = "<p>Falta configurar tu API Key gratuita de AbstractAPI en el código.</p>";
          return;
        }

        resTel.innerHTML = "<p>Consultando número...</p>";

        try {
          const respuesta = await fetch(`https://phonevalidation.abstractapi.com/v1/?api_key=${apiKey}&phone=${encodeURIComponent(numero)}`);
          const datos = await respuesta.json();

          if (datos.error) {
            resTel.innerHTML = `<p>Error: ${datos.error.message}</p>`;
            return;
          }

          resTel.innerHTML = `
            <p><strong>Número:</strong> ${datos.format.international || numero}</p>
            <p><strong>Válido:</strong> ${datos.valid ? "Sí" : "No"}</p>
            <p><strong>País:</strong> ${datos.country.name || "Desconocido"}</p>
            <p><strong>Operadora:</strong> ${datos.carrier || "No disponible"}</p>
            <p><strong>Tipo de línea:</strong> ${datos.type || "Desconocido"}</p>
          `;
        } catch (error) {
          resTel.innerHTML = "<p>Error de conexión al consultar el número.</p>";
        }
      });
    </script>

  </body>
</html>
