<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8" />
  <title>Ruleta Interactiva</title>
  <style>
    body {
      font-family: Arial, sans-serif;
      background: #0f172a;
      color: #f8fafc;
      text-align: center;
      margin: 0;
      padding: 32px 16px;
    }

    .zona-ruleta {
      position: relative;
      width: 300px;
      height: 300px;
      margin: 24px auto;
    }

    .puntero {
      position: relative;
      z-index: 2;
      font-size: 2rem;
      line-height: 1;
      color: #facc15;
      margin-bottom: -10px;
      text-shadow: 0 3px 8px rgba(0, 0, 0, 0.7);
    }

    .ruleta {
      width: 100%;
      height: 100%;
      border-radius: 50%;
      border: 8px solid #334155;
      box-sizing: border-box;
      background: conic-gradient(
        #ef4444 0deg 60deg,
        #f59e0b 60deg 120deg,
        #10b981 120deg 180deg,
        #06b6d4 180deg 240deg,
        #8b5cf6 240deg 300deg,
        #ec4899 300deg 360deg
      );
      box-shadow: 0 12px 0 #090d16, 0 22px 35px rgba(0, 0, 0, 0.55);
      transition: transform 4s cubic-bezier(0.15, 0.85, 0.2, 1);
    }

    button#girar {
      background: #10b981;
      color: #06281e;
      border: none;
      border-radius: 12px;
      padding: 14px 32px;
      font-size: 1.1rem;
      font-weight: bold;
      cursor: pointer;
      box-shadow: 0 5px 0 #047857;
      transition: transform 0.12s ease, box-shadow 0.12s ease;
    }

    button#girar:active {
      transform: translateY(3px);
      box-shadow: 0 2px 0 #047857;
    }

    #resultado {
      margin-top: 20px;
      font-size: 1.25rem;
      font-weight: bold;
      color: #38bdf8;
    }
  </style>
</head>
<body>
  <h1>RULETA INTERACTIVA</h1>
  <p>Haz clic en girar para elegir una opción al azar.</p>

  <div class="zona-ruleta">
    <div class="puntero">▼</div>
    <div class="ruleta"></div>
  </div>

  <button type="button" id="girar">GIRAR</button>
  <p id="resultado">Resultado: —</p>
</body>
</html>
